type: custom:apexcharts-card
update_interval: 10min
grid_options:
  columns: full
header:
  title: PV-Prognose und Messwerte (Solar Forecast ML)
  show: true
  standard_format: true
  show_states: true
  colorize_states: true
apex_config:
  chart:
    height: 250px
  tooltip:
    enabled: true
    shared: true
    followCursor: true
  # Farbverläufe unter den Messkurven (Serien 2–4); die Prognoselinie (Serie 1)
  # und die reinen Kopfzeilenwerte bleiben ohne Verlauf.
  fill:
    type:
      - solid
      - gradient
      - gradient
      - gradient
      - solid
      - solid
      - solid
      - solid
      - solid
      - solid
    gradient:
      shade: dark
      type: vertical
      shadeIntensity: 0.15
      opacityFrom: 0.9
      opacityTo: 0.15
      stops:
        - 0
        - 100
graph_span: 0.999d
now:
  show: true
  color: blue
span:
  start: day
all_series_config:
  type: area
  opacity: 0.9
  stroke_width: 1
yaxis:
  - id: kw
    show: true
    min: 0
    apex_config:
      tickAmount: 5
      title:
        text: kW (DC)
  - id: soc
    show: true
    opposite: true
    min: 0
    max: 100
    apex_config:
      tickAmount: 5
      title:
        text: Batterie %
  - id: header_only
    show: false
series:
  - entity: sensor.sfml_card_prognose
    name: SFML Prognose (DC)
    yaxis_id: kw
    type: line
    color: orange
    opacity: 1
    stroke_width: 2
    stroke_dash: 5
    extend_to: false
    show:
      legend_value: false
      in_header: false
    data_generator: |
      var heute = new Date();
      var daten = JSON.parse(entity.attributes.hourly_forecast || "[]");
      return daten.map((eintrag) => {
        var zeit = new Date(heute.getFullYear(), heute.getMonth(), heute.getDate(), eintrag.hour, 30);
        return [zeit, eintrag.kwh];
      });
  - entity: sensor.sfml_card_tagesverlauf
    name: Solarerzeugung (DC)
    extend_to: now
    yaxis_id: kw
    type: area
    color: orange
    stroke_width: 2
    opacity: 0.9
    unit: kW
    float_precision: 3
    show:
      legend_value: true
      in_header: false
    data_generator: |
      var reihe = JSON.parse(entity.attributes.series || "[]");
      return reihe.map(p => [p.t * 1000, p.s / 1000]);
  - entity: sensor.sfml_card_tagesverlauf
    name: Verbrauch (AC)
    extend_to: now
    yaxis_id: kw
    type: area
    color: red
    stroke_width: 2
    opacity: 0.9
    unit: kW
    float_precision: 3
    show:
      legend_value: true
      in_header: false
    data_generator: |
      var reihe = JSON.parse(entity.attributes.series || "[]");
      return reihe.map(p => [p.t * 1000, p.h / 1000]);
  - entity: sensor.sfml_card_tagesverlauf
    name: Batterie
    extend_to: now
    yaxis_id: soc
    type: area
    color: lightgreen
    stroke_width: 2
    opacity: 0.9
    unit: "%"
    float_precision: 0
    show:
      legend_value: true
      in_header: false
    data_generator: |
      var reihe = JSON.parse(entity.attributes.series || "[]");
      return reihe.filter(p => p.b !== null).map(p => [p.t * 1000, p.b]);
  - entity: sensor.sfml_card_ertrag_heute
    yaxis_id: header_only
    name: Heute bis jetzt
    data_generator: |
      return [[new Date(), parseFloat(entity.state)]];
    float_precision: 1
    color: orange
    unit: " kWh"
    show:
      legend_value: true
      in_header: true
      in_chart: false
  - entity: sensor.sfml_card_prognose
    yaxis_id: header_only
    name: Prognose heute
    data_generator: |
      return [[new Date(), parseFloat(entity.state)]];
    color: "#FF69B4"
    float_precision: 1
    unit: " kWh"
    show:
      legend_value: true
      in_header: true
      in_chart: false
  - entity: sensor.sfml_card_prognose
    data_generator: |
      return [[new Date(), entity.attributes.rest_kwh]];
    yaxis_id: header_only
    name: Prognose heute Rest
    color: "#FF69B4"
    float_precision: 1
    unit: " kWh"
    show:
      legend_value: true
      in_header: true
      in_chart: false
  - entity: sensor.sfml_card_prognose
    data_generator: |
      return [[new Date(), entity.attributes.naechste_stunde_kwh]];
    yaxis_id: header_only
    name: Prognose nächste Stunde
    color: "#FF69B4"
    float_precision: 1
    unit: " kWh"
    show:
      legend_value: true
      in_header: true
      in_chart: false
  - entity: sensor.sfml_card_prognose
    data_generator: |
      return [[new Date(), entity.attributes.morgen_kwh]];
    yaxis_id: header_only
    name: Prognose morgen
    color: "#8B008B"
    float_precision: 1
    unit: " kWh"
    show:
      legend_value: true
      in_header: true
      in_chart: false
  - entity: sensor.sfml_card_prognose
    data_generator: |
      return [[new Date(), entity.attributes.uebermorgen_kwh]];
    yaxis_id: header_only
    name: Prognose übermorgen
    color: "#8B008B"
    float_precision: 1
    unit: " kWh"
    show:
      legend_value: true
      in_header: true
      in_chart: false
